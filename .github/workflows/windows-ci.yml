name: Windows CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ExtractAndDelete.slnx

      - name: Build
        run: dotnet build .\ExtractAndDelete.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\ExtractAndDelete.slnx --configuration Release --no-build --verbosity normal --filter "Category!=WindowsIntegration"
